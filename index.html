<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AK Planner</title>
  <meta name="description" content="Ứng dụng quản lý công việc, tập trung và mục tiêu cá nhân." />
  <meta name="theme-color" content="#EAF8EE" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A1A11" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AK Planner" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="blob blob-c" aria-hidden="true"></div>

  <div class="shell">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar glass" aria-label="Điều hướng chính">
      <button class="tab" data-tab="home" aria-label="Trang chủ"></button>
      <button class="tab" data-tab="calendar" aria-label="Lịch"></button>
      <button class="fab" id="fab" aria-label="Thêm công việc"></button>
      <button class="tab" data-tab="read" aria-label="Đọc sách"></button>
      <button class="tab" data-tab="analytics" aria-label="Thống kê"></button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="readings.js"></script>
  <script src="app.js"></script>
</body>
</html>
